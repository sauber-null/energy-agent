[project]
name = "energy-agent"
version = "0.1.0"
description = "Tool-calling AI agent for German electricity market processes (GPKE) with RAG over BNetzA documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pymupdf>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
energy-agent = "energy_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "integration: needs the Postgres container and Ollama with an ingested corpus",
    "eval: runs the golden set against a real LLM (slow, opt-in: pytest -m eval)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Rule texts and seed rows are kept on one line each to match the source tables.
"src/energy_agent/tools/deadlines.py" = ["E501"]
"src/energy_agent/tools/switch_requests.py" = ["E501"]
