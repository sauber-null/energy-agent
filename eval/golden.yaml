  dates: [2026-11-19]
  times: ["05:00", "06:00"]
  reference_call: {process: lieferende_nb, step: 3, step1_sent_at: "2026-11-17T09:00"}

- id: ev-antwort-gleicher-tag
  category: deadline
  question: "Der Netzbetreiber kündigt dem Ersatzversorger am 14.10.2026 um 11:00 Uhr dessen Zuordnung zum 15.10.2026 an. Bis wann muss der Ersatzversorger antworten?"
