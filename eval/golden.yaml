  reference_call: {process: lieferende_lf, step: 2, step1_sent_at: "2026-12-30T14:00"}

- id: lieferende-nb-fenster-busstag
  category: deadline
  question: "Der Netzbetreiber kündigt am 17.11.2026 dem Lieferanten die Beendigung seiner Zuordnung an (Lieferende vom Netzbetreiber ausgehend). In welchem Zeitfenster muss der Netzbetreiber die Beendigung der Zuordnung übermitteln?"
