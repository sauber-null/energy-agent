  deadline_args: {process: kuendigung, step: [2]}
  dates: [2026-11-02]
  reference_call: {process: kuendigung, step: 2, step1_sent_at: "2026-10-30T09:00"}

- id: abmeldung-spaetester-tag
  category: deadline
  question: "Ein Lieferant möchte die Belieferung einer Marktlokation (keine EEG-Anlage) zum Zuordnungsende 01.12.2026 beim Netzbetreiber abmelden. Wann muss die Abmeldung spätestens übermittelt werden?"
  tools: [calculate_deadline]
  deadline_args: {process: lieferende_lf, step: [1]}
  dates: [2026-11-29]
  reference_call: {process: lieferende_lf, step: 1, assignment_date: "2026-12-01"}

- id: abmeldung-bestaetigung-jahreswechsel
  category: deadline
  question: "Eine Abmeldung zum Lieferende wurde am 30.12.2026 um 14:00 Uhr an den Netzbetreiber gesendet. Bis wann muss der Netzbetreiber die Beendigung der Zuordnung spätestens bestätigen?"
