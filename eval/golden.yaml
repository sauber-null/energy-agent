  deadline_args: {process: lieferbeginn, step: [1]}
  dates: [2026-10-29]
  reference_call: {process: lieferbeginn, step: 1, assignment_date: "2026-11-02"}

- id: malo-anfrage-nacht
  category: deadline
  question: "Ein Lieferant stellt am 30.10.2026 um 23:30 Uhr eine Anfrage zur Ermittlung der MaLo-ID. Bis wann muss der Netzbetreiber antworten?"
