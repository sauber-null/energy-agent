  dates: [2026-10-31]
  times: ["01:30"]
  reference_call: {process: malo_ermittlung, step: 2, step1_sent_at: "2026-10-30T23:30"}

- id: kuendigung-antwort
  category: deadline
  question: "Der neue Lieferant schickt dem bisherigen Lieferanten am Freitag, 30.10.2026 eine Kündigung. Bis wann muss der bisherige Lieferant spätestens antworten?"
