  deadline_args: {process: ersatzversorgung_beginn, step: [2]}
  dates: [2026-10-14]
  times: ["15:00"]
  reference_call: {process: ersatzversorgung_beginn, step: 2, step1_sent_at: "2026-10-14T11:00", assignment_date: "2026-10-15"}

- id: lb-bestaetigung-fronleichnam
  category: deadline
  question: "Eine Anmeldung zum Lieferbeginn wurde am Mittwoch, 03.06.2026 an den Netzbetreiber gesendet. Bis wann muss der Netzbetreiber die Zuordnung des neuen Lieferanten spätestens bestätigen?"
