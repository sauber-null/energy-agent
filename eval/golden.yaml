# Golden questions for the end-to-end evaluation (`energy-agent eval`).
#
# Expected answers were derived by hand from the GPKE / BK6-22-024 texts and the GPKE
# working-day rules, not from the agent. "Today" is fixed to 2026-10-27 during the eval.
#
# Fields:
#   tools          tools that must be called
#   deadline_args  a calculate_deadline call must use this process and one of these steps
#   dates / times  must appear in the answer (any common German or ISO format)
#   keywords       each inner list is a group; one alternative per group must appear
#   forbidden      must not appear in the answer
#   section        retrieval eval: a top-k passage must come from a section containing this
#   reference_call calculate_deadline arguments that must reproduce dates/times (checked in
#                  tests/test_golden.py, so golden set and tool cannot drift apart silently)

# --- Deadlines -------------------------------------------------------------------------

- id: lb-ablehnung-weihnachten
  category: deadline
  question: "Ein Lieferant hat seine Anmeldung zum Lieferbeginn am 23.12.2026 um 10:00 Uhr an den Netzbetreiber gesendet. Bis wann muss der Netzbetreiber die Anmeldung spätestens ablehnen?"
  tools: [calculate_deadline]
  deadline_args: {process: lieferbeginn, step: [6]}
  dates: [2026-12-28]
  times: ["11:00"]
  reference_call: {process: lieferbeginn, step: 6, step1_sent_at: "2026-12-23T10:00"}

- id: lb-fruehester-beginn-pfingsten
  category: deadline
  question: "Ein Lieferant meldet am Freitag, 6. Juni 2025 eine Marktlokation zum Lieferbeginn an. Ab wann kann er frühestens beliefern?"
  tools: [calculate_deadline]
  deadline_args: {process: lieferbeginn, step: [1]}
  dates: [2025-06-11]
  reference_call: {process: lieferbeginn, step: 1, step1_sent_at: "2025-06-06T12:00"}

- id: lb-fruehester-beginn-montag
  category: deadline
  question: "Die Anmeldung zum Lieferbeginn wird am Montag, 26.10.2026 verschickt. Was ist der früheste mögliche Lieferbeginn?"
  tools: [calculate_deadline]
  deadline_args: {process: lieferbeginn, step: [1]}
  dates: [2026-10-28]
  reference_call: {process: lieferbeginn, step: 1, step1_sent_at: "2026-10-26T12:00"}

- id: lb-spaetester-anmeldetag
  category: deadline
  question: "Der Lieferbeginn soll am 02.11.2026 sein. An welchem Tag muss die Anmeldung spätestens an den Netzbetreiber übermittelt werden?"
