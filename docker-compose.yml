services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy  # local development only
      POSTGRES_DB: energy_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy -d energy_agent"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
