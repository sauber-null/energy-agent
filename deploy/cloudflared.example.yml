# Setup (once):
#   cloudflared tunnel login                      # pick your domain in the browser
#   cloudflared tunnel create energy-agent        # prints the tunnel id
#   cloudflared tunnel route dns energy-agent demo.example.com
# then copy this file to ~/.cloudflared/config.yml and fill in id and hostname.
tunnel: energy-agent
credentials-file: /Users/YOUR_USER/.cloudflared/TUNNEL_ID.json

ingress:
  # Only the demo is exposed; it listens on localhost and asks for the demo password.
  - hostname: demo.example.com
    service: http://localhost:8000
  - service: http_status:404
